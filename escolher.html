<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Escolha o sistema</title>
<style>
  :root{--bg:#061120;--card:#0d2038;--fg:#e6eef8;--mut:#8aa0b8;--ac:#0284c7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:24px}
  main{max-width:720px;width:100%}
  h1{font-size:1.4rem;margin:0 0 6px}
  p{color:var(--mut);margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  a{display:block;background:var(--card);border:1px solid #1b3556;border-radius:12px;padding:20px;color:inherit;text-decoration:none}
  a:hover{border-color:var(--ac)}
  strong{display:block;font-size:1.1rem;margin-bottom:6px}
  span{color:var(--mut);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Escolha o sistema</h1>
  <p>Página provisória para visualizar os dois sistemas lado a lado.</p>
  <div class="grid">
    <a href="sistema-a/"><strong>Sistema A</strong><span>Home longa, com simulação em 2 etapas.</span></a>
    <a href="sistema-b/"><strong>Sistema B</strong><span>Home mais curta e direta.</span></a>
  </div>
</main>
</body>
</html>
